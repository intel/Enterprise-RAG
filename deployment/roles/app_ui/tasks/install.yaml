---
- name: "app_ui | Set override_values.yaml path"
  ansible.builtin.set_fact:
    ui_helm_override_values_path: "{{ rag_tmp_dir }}/{{ ui_helm_chart_name }}-override-values.yaml"

- name: "app_ui | Generate override values file from template"
  ansible.builtin.template:
    src: "values.yaml.j2"
    dest: "{{ ui_helm_override_values_path }}"
    mode: '0644'

- name: "app_ui | Set values_files list"
  ansible.builtin.set_fact:
    values_files: >
      {{
        [ui_helm_default_values_file] +
        [ui_helm_override_values_path]
      }}

- name: "app_ui | Ensure namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ui_namespace }}"

- name: "app_ui | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ui_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
          erag-istio-protected: "true"
  when: istio_enabled | default(false) | bool

- name: "app_ui | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ui_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

# The UI owns the root of the apex host. In path mode the platform admits apex
# routes only from namespaces holding a path grant, and longer grants
# (/keycloak, /grafana, /api/v1/mcp, ...) still win over '/'. In subdomain mode
# the grant is recorded but not enforced. The route itself comes from the chart
# (httpRoute.gatewayRef, sectionName https-apex = gateway_publish.parent_ref).
- name: "app_ui | Publish the UI on the apex host"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: publish.yaml
  vars:
    gateway_publish_name: rag-ui
    gateway_publish_namespace: "{{ ui_namespace }}"
    gateway_publish_host: "{{ ui_domain_name }}"
    gateway_publish_path: "/"
    gateway_publish_mode: path

- name: "app_ui | Install or Upgrade Helm chart"
  kubernetes.core.helm:
    name: "{{ ui_helm_release_name }}"
    chart_ref: "{{ ui_helm_chart_directory }}"
    namespace: "{{ ui_namespace }}"
    values_files: "{{ values_files }}"
    state: present
    create_namespace: true
    timeout: "{{ helm_timeout }}"
  register: helm_repo_install_result
  until: helm_repo_install_result is succeeded
  retries: "{{ helm_retries }}"
  delay: 15
