---

- name: "app_generate_password | Check if password already exists in password file"
  ansible.builtin.command: "grep -q '^{{ item.name }}_PASSWORD:' {{ password_file }}"
  register: password_exists_check
  changed_when: false
  ignore_errors: true
  no_log: "{{ secure_logs }}"

- name: "app_generate_password | Generate password"
  when: password_exists_check.rc != 0
  block:
  - name: "app_generate_password | Generate a secure password if username line does not exist"
    ansible.builtin.set_fact:
      password: "{{ lookup('community.general.random_string', min_lower=2, min_upper=2, min_special=2, min_numeric=2, length=12, override_special='_())') }}"
    no_log: "{{ secure_logs }}"

  - name: "app_generate_password | Write username to the file if it does not exist"
    ansible.builtin.lineinfile:
      path: "{{ password_file }}"
      line: "{{ item.name }}_USERNAME: {{ item.user }}"
      create: yes
      mode: '0600'
      regexp: "^{{ item.name }}_USERNAME:.*$"
      state: present
    no_log: "{{ secure_logs }}"

  - name: "app_generate_password | Write password to the file if it does not exist"
    ansible.builtin.lineinfile:
      path: "{{ password_file }}"
      line: "{{ item.name }}_PASSWORD: {{ password }}"
      create: yes
      mode: '0600'
      regexp: "^{{ item.name }}_PASSWORD:.*$"
      state: present
    no_log: "{{ secure_logs }}"

  - name: "app_generate_password | Set fact for password"
    ansible.builtin.set_fact:
      "{{ item.name }}_PASSWORD": "{{ password }}"
    no_log: "{{ secure_logs }}"

- name: "app_generate_password | Load existing password from file"
  when: password_exists_check.rc == 0
  block:
  - name: "app_generate_password | Read existing password from password file"
    ansible.builtin.shell:
      cmd: "set -o pipefail && grep '^{{ item.name }}_PASSWORD:' {{ password_file }} | cut -d':' -f2- | xargs"
      executable: /bin/bash
    register: existing_password
    changed_when: false
    no_log: "{{ secure_logs }}"

  - name: "app_generate_password | Set fact for existing password"
    ansible.builtin.set_fact:
      "{{ item.name }}_PASSWORD": "{{ existing_password.stdout }}"
    no_log: "{{ secure_logs }}"
