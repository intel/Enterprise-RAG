---
- name: "app_apisix | Ensure Helm repository is added"
  kubernetes.core.helm_repository:
    name: "{{ apisix_helm_repo_name }}"
    repo_url: "{{ apisix_helm_repo_url }}"
    state: present
  register: helm_repo_add_result
  until: helm_repo_add_result is succeeded
  retries: "{{ helm_retries }}"
  delay: 15

- name: "app_apisix | Build Helm chart dependencies"
  ansible.builtin.command:
    cmd: helm dependency build
    chdir: "{{ apisix_helm_chart_directory }}"
  register: helm_repo_add_result
  changed_when: true
  until: helm_repo_add_result is succeeded
  retries: "{{ helm_retries }}"
  delay: 15

- name: "app_apisix | Ensure namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ apisix_namespace }}"

- name: "app_apisix | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ apisix_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
          erag-istio-protected: "true"
  when: istio_enabled | default(false) | bool

# Host-network apiserver (no mesh identity) can't reach the ingress controller's
# admission webhook under STRICT; open only its port, rest stays STRICT.
- name: "app_apisix | Allow apiserver to reach IC webhook (port-level mTLS)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.istio.io/v1
      kind: PeerAuthentication
      metadata:
        name: allow-webhook
        namespace: "{{ apisix_namespace }}"
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: ingress-controller
        mtls:
          mode: STRICT
        portLevelMtls: "{{ {'9443': {'mode': 'PERMISSIVE'}} }}"
  when: istio_enabled | default(false) | bool

- name: "app_apisix | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ apisix_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

# The apisix-ingress-controller subchart ships its own CRDs and a Gateway API
# v1.3.0 experimental bundle in crds/. The Gateway API CRDs belong to the platform
# (envoy_gateway), whose safe-upgrades ValidatingAdmissionPolicy rejects any bundle
# before v1.5.0 - including Helm's create of a CRD that already exists, so the
# install fails although Helm would have skipped them. Apply only the APISIX CRDs
# here, server-side (Helm never upgrades crds/), and let Helm skip crds/ entirely.
- name: "app_apisix | Render APISIX CRDs"
  kubernetes.core.helm_template:
    chart_ref: "{{ apisix_helm_chart_directory }}"
    values_files:
      - "{{ apisix_helm_default_values_file }}"
    include_crds: true
  register: _apisix_rendered
  changed_when: false
  check_mode: false

- name: "app_apisix | Apply APISIX CRDs (server-side)"
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: "{{ apisix_crds_field_manager }}"
      force_conflicts: true
    definition: "{{ _apisix_crds }}"
  vars:
    _apisix_crds: >-
      {{ _apisix_rendered.stdout | from_yaml_all | select
         | selectattr('kind', 'eq', 'CustomResourceDefinition')
         | selectattr('spec.group', 'eq', 'apisix.apache.org') | list }}

- name: "app_apisix | Wait for APISIX CRDs to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
    wait: true
    wait_condition:
      type: Established
      status: "True"
    wait_timeout: 120
  loop:
    - apisixroutes.apisix.apache.org
    - gatewayproxies.apisix.apache.org

- name: "app_apisix | Install or Upgrade Helm chart"
  kubernetes.core.helm:
    name: "{{ apisix_helm_release_name }}"
    chart_ref: "{{ apisix_helm_chart_directory }}"
    # OpenShift assigns the UIDs: drop the charts' fixed runAsUser/runAsGroup/fsGroup.
    post_renderer: "{{ (role_path ~ '/../../scripts/openshift_post_renderer.py') if cluster_distribution | default('kubernetes') == 'openshift' else omit }}"
    namespace: "{{ apisix_namespace }}"
    values_files: >-
      {{ [apisix_helm_default_values_file]
         + ([apisix_helm_chart_directory ~ '/values-openshift.yaml']
            if cluster_distribution | default('kubernetes') == 'openshift' else []) }}
    state: present
    # CRDs come from the task above (APISIX) and the platform (Gateway API).
    skip_crds: true
    create_namespace: true
    wait: true
    timeout: "{{ helm_timeout }}"
  register: helm_repo_install_result
  until: helm_repo_install_result is succeeded
  retries: "{{ helm_retries }}"
  delay: 15
