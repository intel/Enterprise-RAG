---
- name: "app_edp | Set roles facts"
  ansible.builtin.set_fact:
    edp_helm_override_values_path: "{{ rag_tmp_dir }}/{{ edp_helm_chart_name }}-override-values.yaml"

- name: "app_edp | Resolve ONTAP S3 configuration"
  ansible.builtin.include_tasks:
    file: ontap_s3_resolve.yaml

- name: "app_edp | Build Helm chart dependencies"
  ansible.builtin.command:
    cmd: helm dependency build
    chdir: "{{ edp_helm_chart_directory }}"
  register: helm_repo_add_result
  changed_when: true
  until: helm_repo_add_result is succeeded
  retries: 5
  delay: 15

- name: "app_edp | Ensure namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ edp_namespace }}"

- name: "app_edp | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ edp_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
          erag-istio-protected: "true"
  when: istio_enabled | default(false) | bool

- name: "app_edp | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ edp_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

- name: "app_edp | Publish ONTAP S3 through the gateway"
  ansible.builtin.include_tasks:
    file: ontap_s3_proxy.yaml
  when: _edp_ontap_s3_active | bool

- name: "app_edp | Remove a stale ONTAP S3 reverse proxy"
  ansible.builtin.include_tasks:
    file: ontap_s3_teardown.yaml
  when: not (_edp_ontap_s3_active | bool)

- name: "app_edp | Retrieve minio OIDC client secret from Keycloak"
  block:
    - name: "app_edp | Get client_secret_id keycloak"
      vars:
        get_secret_client_id: "{{ edp_client_id }}"
        get_secret_ns: "{{ edp_namespace }}"
        get_secret_secret_name: "keycloak-minio-secret"
      ansible.builtin.include_role:
        name: app_keycloak_config
        tasks_from: get_secret_id

    - name: "app_edp | Set secret client_secret_id"
      ansible.builtin.set_fact:
        edp_client_secret_id: "{{ client_secret_id.stdout }}"
      no_log: "{{ secure_logs }}"
  rescue:
    - name: "app_edp | Handle missing minio OIDC client during upgrade"
      ansible.builtin.debug:
        msg: >-
          Keycloak client '{{ edp_client_id }}' not found - expected when upgrading from
          a version that did not include the minio OIDC client. The client will be created
          during the install phase by the keycloak configurator.
      when: "'pre-upgrade' in ansible_run_tags"

    - name: "app_edp | Set placeholder client secret for pre-upgrade metadata check"
      ansible.builtin.set_fact:
        edp_client_secret_id: "placeholder-will-be-set-during-install"
      when: "'pre-upgrade' in ansible_run_tags"

    - name: "app_edp | Fail on missing client secret during install"
      ansible.builtin.fail:
        msg: "Failed to retrieve client secret for '{{ edp_client_id }}'. The keycloak configurator should have created this client."
      when: "'pre-upgrade' not in ansible_run_tags"

- name: "app_edp | Generate random string for keys"
  ansible.builtin.include_role:
    name: app_generate_password
    tasks_from: generate_key
  loop:
    - {name: EDP_MINIO_ACCESS_KEY}
    - {name: EDP_MINIO_SECRET_KEY}
  no_log: "{{ secure_logs }}"

- name: "app_edp | Generate password"
  ansible.builtin.include_role:
    name: app_generate_password
    tasks_from: generate_password
  loop:
    - {name: EDP_REDIS, user: "{{ edp_redis_username }}"}
    - {name: EDP_POSTGRESQL, user: "{{ edp_postgresql_user_username }}"}
    - {name: EDP_POSTGRESQL_ADMIN, user: "{{ edp_postgresql_admin_username }}"}
  no_log: "{{ secure_logs }}"

- name: "app_edp | Assert SharePoint configuration is complete"
  ansible.builtin.assert:
    that: _sp_missing | length == 0
    fail_msg: >-
      Incomplete SharePoint configuration: erag_keycloak_oidc_tenant_id is set but
      {{ _sp_missing | join(', ') }} {{ 'is' if _sp_missing | length == 1 else 'are' }} empty.
      SharePoint ingestion requires erag_keycloak_oidc_tenant_id,
      erag_keycloak_oidc_client_id, erag_keycloak_oidc_client_secret and
      erag_keycloak_oidc_endpoint together.
      Set them in env/<name>/config.rag.yaml, or clear erag_keycloak_oidc_tenant_id
      to disable SharePoint.
    success_msg: "app_edp: SharePoint configuration complete"
    quiet: true
  vars:
    _sp_missing: >-
      {{ {'erag_keycloak_oidc_endpoint': erag_keycloak_oidc_endpoint | default('', true) | string | trim,
          'erag_keycloak_oidc_client_id': erag_keycloak_oidc_client_id | default('', true) | string | trim,
          'erag_keycloak_oidc_client_secret': erag_keycloak_oidc_client_secret | default('', true) | string | trim}
         | dict2items | selectattr('value', 'falsy') | map(attribute='key') | list }}
  when: erag_keycloak_oidc_tenant_id | default('', true) | string | trim | length > 0

- name: "app_edp | Assert SharePoint sync lock TTL is a positive integer"
  ansible.builtin.assert:
    that:
      - _sp_ttl is match('^[0-9]+$')
      - _sp_ttl | int > 0
    fail_msg: >-
      edp_sp_sync_lock_ttl_seconds must be a positive whole number of seconds,
      got '{{ edp_sp_sync_lock_ttl_seconds | default('') }}'. It is passed to EDP as
      EDP_SP_SYNC_LOCK_TTL_SECONDS and parsed with int() at startup, so any other
      value crashes the EDP backend and celery workers.
    success_msg: "app_edp: SharePoint sync lock TTL valid ({{ _sp_ttl }}s)"
    quiet: true
  vars:
    _sp_ttl: "{{ edp_sp_sync_lock_ttl_seconds | default('', true) | string | trim }}"

- name: "app_edp | Generate override values file from template"
  ansible.builtin.template:
    src: "values.yaml.j2"
    dest: "{{ edp_helm_override_values_path }}"
    mode: '0644'

- name: "app_edp | Set values_files list"
  ansible.builtin.set_fact:
    values_files: >
      {{
        [edp_helm_default_values_file] +
        [edp_helm_override_values_path]
      }}

- name: "app_edp | Include SeaweedFS tasks"
  ansible.builtin.include_tasks:
    file: seaweedfs.yaml
  when: edp_storage_type == 'seaweedfs'

- name: "app_edp | Install or Upgrade Helm chart"
  kubernetes.core.helm:
    name: "{{ edp_helm_release_name }}"
    chart_ref: "{{ edp_helm_chart_directory }}"
    namespace: "{{ edp_namespace }}"
    values_files: "{{ values_files }}"
    state: present
    dependency_update: true
    create_namespace: true
    timeout: "{{ helm_timeout }}"
    wait: true
  register: helm_repo_install_result
  until: helm_repo_install_result is succeeded
  retries: 5
  delay: 15

- name: "app_edp | Mark secrets for password management"
  ansible.builtin.include_role:
    name: app_password_mgmt
    tasks_from: markup.yaml
  vars:
    namespace: "{{ edp_namespace }}"
    secret_name: "{{ item.secret_name }}"
    password_mappings: "{{ item.password_mappings }}"
  loop:
    - secret_name: "edp-access-secret"
      password_mappings:
        - {key: EDP_ACCESS_KEY, variable: EDP_MINIO_ACCESS_KEY, user: ""}
        - {key: EDP_SECRET_KEY, variable: EDP_MINIO_SECRET_KEY, user: ""}
    - secret_name: "edp-redis-secret"
      password_mappings:
        - {key: password, variable: EDP_REDIS_PASSWORD, user: "{{ edp_redis_username }}"}
    - secret_name: "edp-postgresql-secret"
      password_mappings:
        - {key: DATABASE_PASSWORD, variable: EDP_POSTGRESQL_PASSWORD, user: "{{ edp_postgresql_user_username }}"}
        - {key: DATABASE_ADMIN_PASSWORD, variable: EDP_POSTGRESQL_ADMIN_PASSWORD, user: "{{ edp_postgresql_admin_username }}"}
