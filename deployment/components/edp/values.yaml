lateChunking:
  enabled: false
  nameOverride: "edp-late-chunking"
  name: "enterprise-rag-late-chunking"
  repository: "docker.io/intel"
  tag: latest
  pullPolicy: Always
  replicas: 1
  environment:
    - name: OMP_NUM_THREADS
      valueFrom:
        resourceFieldRef:
          resource: limits.cpu
  config:
    chunk_size: "512"
    chunk_overlap: "0"
    embedding_service_endpoint: "http://embedding-svc.chatqna.svc:6000/v1/embeddings"
    model_name: "jinaai/jina-embeddings-v2-base-en"
  resources:
    requests:
      cpu: "4"
      memory: "1Gi"
    limits:
      cpu: "8"
      memory: "8Gi"
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetValue: 2
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 25
          periodSeconds: 15
        - type: Pods
          value: 1
          periodSeconds: 15
      scaleUp:
        selectPolicy: Max
        stabilizationWindowSeconds: 0
        policies:
        - type: Pods
          value: 1
          periodSeconds: 15

textExtractor:
  nameOverride: "edp-text-extractor"
  name: "enterprise-rag-text-extractor"
  repository: "docker.io/intel"
  tag: latest
  pullPolicy: Always
  replicas: 1
  environment:
    - name: OMP_NUM_THREADS
      value: "1"
    - name: TEXT_EXTRACTOR_MAX_WORKERS
      valueFrom:
        resourceFieldRef:
          resource: limits.cpu
    # Cap docling / ONNXRuntime intra-op thread pool to 1 thread PER PROCESS.
    # The extractor spawns TEXT_EXTRACTOR_MAX_WORKERS (= limits.cpu) Python
    # worker processes for page-parallel extraction; each worker also holds
    # its own docling model. If ORT itself is allowed multiple intra-op
    # threads, N workers × M threads over-subscribes the pod's CPU cgroup
    # and thrashes the scheduler. One worker → one core → one ORT thread is
    # the correct fit. Without this cap, ORT queries the HOST's
    # hardware_concurrency() (bypasses the cgroup cpuset) and spawns dozens
    # of threads per worker — OOM territory on high-core boxes.
    - name: DOCLING_NUM_THREADS
      value: "1"
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "12"
      memory: "30Gi"
  hpa:
    minReplicas: 1
    maxReplicas: 3
    scaleUpTargetValue: 2
    scaleDownTargetValue: "1"
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 25
          periodSeconds: 15
        - type: Pods
          value: 1
          periodSeconds: 15
      scaleUp:
        selectPolicy: Max
        stabilizationWindowSeconds: 60
        policies:
        - type: Pods
          value: 1
          periodSeconds: 60

