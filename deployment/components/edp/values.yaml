  config:
    connector: "langchain"
    modelName: "nomic-ai/nomic-embed-text-v1"
    modelServer: "vllm"
    # Model servers live outside this namespace (deployed by Enterprise
    # Inference), so there is no usable default. Supply it when enabling this.
    modelServerEndpoint: ""
    timeout: "120"
    eragLoggerLevel: "INFO"
  nameOverride: "edp-embedding"
  name: "enterprise-rag-embedding"
  repository: "docker.io/intel"
  tag: latest
  pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

ingestion:
  nameOverride: "edp-ingestion"
  name: "enterprise-rag-ingestion"
  repository: "docker.io/intel"
  tag: latest
  config:
    eragLoggerLevel: "INFO" # "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
    embedding_model_name: *embedding_model_name # catalog name, e.g. "nomic-embed"
    # Vector Algorithm configuration
    vector_algorithm: "FLAT" # "FLAT", "HNSW", "SVS-VAMANA"
    vector_dims: "768" # Auto-detected from embedding_model_id by resolve_vector_dims.py; kept here as Helm chart default only
    vector_datatype: "FLOAT32" # FLOAT16, FLOAT32, FLOAT64
    vector_distance_metric: "COSINE" # L2, IP, COSINE
    # For HNSW Algorithm additional settings are available
    vector_hnsw_m: "32"
    vector_hnsw_ef_construction: "32"
    vector_hnsw_ef_runtime: "32"
    vector_hnsw_epsilon: "0.01"
  pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

awsSqs:
  environment:
    - name: AWS_SQS_EVENT_QUEUE_URL
      valueFrom:
        secretKeyRef:
          name: edp-aws-access-secrets
          key: AWS_SQS_EVENT_QUEUE_URL
    - name: EDP_BACKEND_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: edp-aws-access-secrets
          key: EDP_BACKEND_ENDPOINT
    - name: AWS_DEFAULT_REGION
      valueFrom:
        secretKeyRef:
          name: edp-aws-access-secrets
          key: AWS_DEFAULT_REGION
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: edp-aws-access-secrets
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: edp-aws-access-secrets
          key: AWS_SECRET_ACCESS_KEY
  enabled: false
  nameOverride: "edp-aws"
  name: "enterprise-rag-enhanced-dataprep"
  repository: "docker.io/intel"
  tag: latest
  pullPolicy: Always
  command: "python sqs.py"
  replicas: 1
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: "edp"
fullnameOverride: "edp-chart"

#This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  create: true
  automount: true
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000

securityContextWithTemp:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000

nodeSelector: {}

tolerations: []

affinity: {}

# APISIX routes for EDP. Common values injected by app_apisix.
apisix:
  endpoints:
    - name: edp-presigned
      enabled: true
      namespace: edp
      path: /api/v1/edp/presignedUrl
      backend_service: edp-backend
      service_port: 5000
      rate_limit_count: 120
      service_regex:
        - ^/api/v1/edp/presignedUrl$
        - /api/presignedUrl
      permissions:
        - admin#admin-access
        - user#user-access
        - maintainer#maintainer-access
    - name: edp-admin
      enabled: true
      namespace: edp
      path: /api/v1/edp/*
      backend_service: edp-backend
      service_port: 5000
      rate_limit_count: 120
      service_regex:
        - ^/api/v1/edp/links$
        - /api/links
        - ^/api/v1/edp/link/([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})$
        - /api/link/$1
        - ^/api/v1/edp/link/([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})/retry$
        - /api/link/$1/retry
        - ^/api/v1/edp/link/([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})/task$
        - /api/link/$1/task
        - ^/api/v1/edp/files$
        - /api/files
        - ^/api/v1/edp/file/([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})$
        - /api/file/$1
        - ^/api/v1/edp/file/([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})/retry$
        - /api/file/$1/retry
        - ^/api/v1/edp/file/([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})/task$
        - /api/file/$1/task
        - ^/api/v1/edp/list_buckets$
        - /api/list_buckets
        - ^/api/v1/edp/file/([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})/extract$
        - /api/file/$1/extract
        - ^/api/v1/edp/link/([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})/extract$
        - /api/link/$1/extract
        - ^/api/v1/edp/retrieve$
        - /api/retrieve
        - ^/api/v1/edp/files/sync
        - /api/files/sync
        - ^/api/v1/edp/sharepoint/sites$
        - /api/sharepoint/sites
        - ^/api/v1/edp/sharepoint/sites/([^/]+)$
        - /api/sharepoint/sites/$1
        - ^/api/v1/edp/sharepoint/sync$
        - /api/sharepoint/sync
        - ^/api/v1/edp/sharepoint/file-url$
        - /api/sharepoint/file-url
        - ^/api/v1/edp/sharepoint/files$
        - /api/sharepoint/files
      permissions:
        - admin#admin-access
        - maintainer#maintainer-access

monitoring:
  enabled: true
