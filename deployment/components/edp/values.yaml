    concurrency: "6"
    logLevel: "info"
    eragLoggerLevel: "INFO" # "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
    # CELERY_BATCH_SIZE (chunks sent per batch to the embedding service) and
    # MAX_NEW_WORKERS are computed in templates/configmap.yaml from
    # embeddingReplicas and balloonsEnabled:
    # - balloons enabled:  workers = replicas x 8, batch size = replicas x 128
