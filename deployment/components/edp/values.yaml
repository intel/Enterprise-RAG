# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# allowInsecureImages due to repository override to: [bitnamilegacy]
global:
  security:
    allowInsecureImages: true
  parentChartDefined: true

pipelineNamespace: "chatqna"

# Replica count of the embedding model served by Enterprise Inference. Supplied
# by the app_edp role; drives MAX_NEW_WORKERS and CELERY_BATCH_SIZE.
embeddingReplicas: 1

proxy:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

edpExternalUrl: "https://s3.solutions.ai"
edpExternalCertVerify: "false"
edpInternalUrl: "http://seaweedfs-s3.seaweedfs.svc:8333"
edpInternalCertVerify: "false"
edpBaseRegion: 'us-east-1'
edpSqsEventQueueUrl: ""
edpAccessKey: ""
edpSecretKey: ""
edpOidcConfigUrl: "http://keycloak-service.keycloak.svc:8080/realms/EnterpriseRAG/.well-known/openid-configuration"
edpOidcClientSecret: ""
bucketNameRegexFilter: '.*'
presignedUrlCredentialsSystemFallback: "false"
# Catalog name (models.yaml -> name): what KServe serves the model as, and what
# vLLM accepts in the request "model" field
embedding_model_name: &embedding_model_name "nomic-embed"

sharepointTenantId: ""
sharepointClientId: ""
sharepointClientSecret: ""
keycloakBrokerIdpAlias: ""
# TTL of the Redis lock that serializes SharePoint sync runs (EDP_SP_SYNC_LOCK_TTL_SECONDS).
# Seconds; must outlast the longest expected sync, otherwise a second sync can start
# while the first is still running.
sharepointSyncLockTtlSeconds: "600"


s3ApiDomain: "s3.solutions.ai"
uiBrowserDomain: "seaweedfs.solutions.ai"
s3DomainPrefix: "s3"
uiBrowserDomainPrefix: "seaweedfs"

redisUrl: "edp-redis:6379"
redisUsername: "default"
redisPassword: ""

postgresDatabasePassword: ""
postgresAdminPassword: ""

seaweedfs:
  namespace: "seaweedfs"
  version: "4.37.0"
  repo: "https://seaweedfs.github.io/seaweedfs/helm"
  persistence:
    enabled: true
    master:
      size: "2Gi"
      volumeSizeLimitMB: 1024
    filer:
      size: "10Gi"
    volume:
      size: "50Gi"
  s3:
    port: 8333
  webhook_endpoint: "http://edp-backend.edp.svc:5000/seaweedfs_event"
  # ignoreBuckets:
  # - name: bucketToIgnore
  # - name: anotherOne
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # anonymousRead: true lets anyone who knows an object name read it without a signature.
  # Downloads go through presigned URLs (or the bearer token with RBAC), so keep it false.
  createBuckets:
  - name: default
    anonymousRead: false
  - name: secondary
    anonymousRead: false
  - name: only-admin
    anonymousRead: false
  iamKeycloak: # used when rbac is enables in the main config yaml
    claim: "minio_roles"
    sts:
      tokenDuration: 1h
      maxSessionLength: 12h
      issuer: seaweedfs-sts
    audiences:
      - "EnterpriseRAG-oidc-minio"
      - "EnterpriseRAG-oidc-backend"
      - "account"
    scopes:
      - "openid"
      - "profile"
      - "email"
      - "roles"
    roleMapping:
      - value: "consoleAdmin"
        role: "arn:aws:iam::role/S3AdminRole"
      - value: "erag-admin-group"
        role: "arn:aws:iam::role/S3UserRole"
      - value: "erag-maintainer-group"
        role: "arn:aws:iam::role/S3UserRole"
      - value: "erag-user-group"
        role: "arn:aws:iam::role/S3ReadOnlyRole"
    defaultRole: "arn:aws:iam::role/S3ReadOnlyRole"
    policies:
      - name: "S3AdminPolicy"
        actions:
          - "s3:*"
        resources:
          - "*"
      - name: "S3UserPolicy"
        actions:
          - "s3:ListBucket"
          - "s3:GetObject"
          - "s3:PutObject"
          - "s3:DeleteObject"
          - "s3:ListAllMyBuckets"
        resources:
          - "arn:aws:s3:::default/*"
          - "arn:aws:s3:::default"
          - "arn:aws:s3:::secondary/*"
          - "arn:aws:s3:::secondary"
      - name: "S3ReadOnlyPolicy"
        actions:
          - "s3:ListBucket"
          - "s3:GetObject"
        resources:
          - "arn:aws:s3:::default/*"
          - "arn:aws:s3:::default"
          - "arn:aws:s3:::secondary/*"
          - "arn:aws:s3:::secondary"
    roles:
      - name: "S3AdminRole"
        arn: "arn:aws:iam::role/S3AdminRole"
        policies:
          - "S3AdminPolicy"
      - name: "S3UserRole"
        arn: "arn:aws:iam::role/S3UserRole"
        policies:
          - "S3UserPolicy"
      - name: "S3ReadOnlyRole"
        arn: "arn:aws:iam::role/S3ReadOnlyRole"
        policies:
          - "S3ReadOnlyPolicy"

postgresql:
  enabled: true
  fullnameOverride: "edp-postgresql"
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: "edp" # cannot refence secret
    database: "edp" # cannot refence secret
    existingSecret: "edp-postgresql-secret"
    secretKey: "DATABASE_PASSWORD"
  resources:
    requests:
      cpu: "100m"
      memory: "200Mi"
    limits:
      cpu: "512m"
      memory: "2Gi"
  persistence:
    enabled: true
    size: "10Gi"

# When minimalConfiguration is true, resource requests/limits for celery and
# textExtractor are reduced to values suitable for a 32-core / 64 GB single-user
# deployment. Set via edp.minimal_configuration: true in config.yaml.
# Individual services.<name>.resources overrides still take priority.
minimalConfiguration: false
minimalResources:
  edp-celery:
    requests:
      cpu: "100m"
  edp-text-extractor:
    requests:
      cpu: "1"

