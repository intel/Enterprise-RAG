apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.contextualRag.nameOverride | default (include "helm-edp.fullname" .) }}
  labels:
    {{- include "helm-edp.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.contextualRag.replicas }}
  selector:
    matchLabels:
      {{- include "helm-edp.contextualRag.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "manifest.podLabels" (list .Values.contextualRag.nameOverride .) | nindent 6 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helm-edp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-llm-service
          image: alpine/curl
          imagePullPolicy: {{ .Values.contextualRag.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: VLLM_SERVER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: edp-contextual-rag-configmap
                  key: VLLM_SERVER_ENDPOINT
          command:
            - sh
            - -c
            - |
                if [ -z "$VLLM_SERVER_ENDPOINT" ]; then
                  echo "Environment variable VLLM_SERVER_ENDPOINT is not set. Skipping the init container.";
                else
                  until curl -s $VLLM_SERVER_ENDPOINT/v1/models; do
                    echo "waiting for llm service $VLLM_SERVER_ENDPOINT to be ready...";
                    sleep 2;
                  done;
                fi;
      containers:
        - name: {{ .Values.contextualRag.nameOverride }}
          securityContext:
            {{- toYaml .Values.securityContextWithTemp | nindent 12 }}
          image: {{ .Values.contextualRag.repository }}/{{ .Values.contextualRag.name }}:{{ .Values.contextualRag.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.contextualRag.pullPolicy }}
          env:
          {{- if .Values.proxy.http_proxy }}
            - name: http_proxy
              value: {{ .Values.proxy.http_proxy }}
          {{- end }}
          {{- if .Values.proxy.https_proxy }}
            - name: https_proxy
              value: {{ .Values.proxy.https_proxy }}
          {{- end }}
          {{- if .Values.proxy.no_proxy }}
            - name: no_proxy
              value: {{ include "helm-edp.noProxyWithContainers" . | quote }}
          {{- end }}
          {{- if .Values.contextualRag.environment }}
            {{- toYaml .Values.contextualRag.environment | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: edp-contextual-rag-configmap
          ports:
            - name: http
              containerPort: 8004
              protocol: TCP
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          livenessProbe:
            failureThreshold: 24
            httpGet:
              path: v1/health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: v1/health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 60
          startupProbe:
            failureThreshold: 120
            httpGet:
              path: v1/health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 60
          resources:
            {{- $defaultValues := toYaml .Values.contextualRag.resources | nindent 12 -}}
            {{- include "manifest.getResource" (list .Values.contextualRag.nameOverride $defaultValues .Values) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
