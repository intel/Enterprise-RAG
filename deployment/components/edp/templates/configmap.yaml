apiVersion: v1
kind: ConfigMap
metadata:
  name: edp-configmap
  namespace: {{ .Release.Namespace }}
data:
  TEXT_EXTRACTOR_ENDPOINT: {{ print "http://" .Values.textExtractor.nameOverride "-headless:9398/v1/text_extractor" | quote }}
  TEXT_COMPRESSION_ENDPOINT: {{ print "http://" .Values.textCompression.nameOverride ":9397/v1/text_compression" | quote }}
  TEXT_SPLITTER_ENDPOINT: {{ print "http://" .Values.textSplitter.nameOverride ":9399/v1/text_splitter" | quote }}
  LATE_CHUNKING_ENABLED: {{ .Values.lateChunking.enabled | quote }}
  LATE_CHUNKING_ENDPOINT: {{ if .Values.lateChunking.enabled }}{{ print "http://" .Values.lateChunking.nameOverride ":8003/v1/late_chunking" | quote }}{{ else }}""{{ end }}
  CONTEXTUAL_RAG_ENABLED: {{ .Values.contextualRag.enabled | quote }}
  CONTEXTUAL_RAG_ENDPOINT: {{ if .Values.contextualRag.enabled }}{{ print "http://" .Values.contextualRag.nameOverride ":8004/v1/contextual_rag" | quote }}{{ else }}""{{ end }}
  {{- /* Per-request timeout the celery worker applies to the compression, splitting
         and contextual-RAG stages. Contextual RAG is the slowest of the three: it
         issues one LLM call per chunk, so documents with many chunks need a larger
         value than the 300s default. */}}
  TEXT_PROCESSING_TIMEOUT_SECONDS: {{ .Values.textProcessingTimeoutSeconds | default "300" | quote }}
  EMBEDDING_ENDPOINT: {{ if .Values.embedding.enabled }}{{ print "http://" .Values.embedding.nameOverride ":6000/v1/embeddings" | quote }}{{ else }}{{ .Values.embedding.remoteEmbeddingUri | quote }}{{ end }}
  INGESTION_ENDPOINT: {{ print "http://" .Values.ingestion.nameOverride ":6120/v1/ingestion" | quote }}
  RETRIEVER_ENDPOINT: http://retriever-svc.{{ .Values.pipelineNamespace }}.svc:6620/v1/retrieval
  RERANKER_ENDPOINT: http://reranking-svc.{{ .Values.pipelineNamespace }}.svc:8000/v1/reranking
  BUCKET_NAME_REGEX_FILTER: {{ .Values.bucketNameRegexFilter | quote }}
  SEAWEEDFS_IGNORE_BUCKETS: "{{ range $i, $b := .Values.seaweedfs.ignoreBuckets }}{{ if $i }},{{ end }}{{ $b.name }}{{ end }}"
  DPGUARD_ENDPOINT: {{ if .Values.dpguard.enabled }}{{ print "http://" .Values.dpguard.nameOverride ":8070/v1/llmguarddataprep" | quote }}{{ else }}""{{ end }}
  DPGUARD_ENABLED: {{ .Values.dpguard.enabled | quote }}
  FINGERPRINT_ENDPOINT: "http://fingerprint-svc.fingerprint.svc:6012/v1/system_fingerprint/config"
  FINGERPRINT_PIPELINE: "dataprep"
  PRESIGNED_URL_CREDENTIALS_SYSTEM_FALLBACK: {{ .Values.presignedUrlCredentialsSystemFallback | quote }}
  USE_BEARER_TOKEN_AUTH: {{ .Values.useBearerTokenAuth | default "false" | quote }}
  {{- $embeddingTimeout := .Values.embedding.config.timeout | default "120" }}
  {{- $embeddingModelName := "unknown" }}
  {{- $embeddingConfigMap := lookup "v1" "ConfigMap" .Values.pipelineNamespace "embedding-usvc-config" }}
  {{- if $embeddingConfigMap }}
    {{- if hasKey $embeddingConfigMap.data "EMBEDDING_TIMEOUT_SECONDS" }}
      {{- $embeddingTimeout = index $embeddingConfigMap.data "EMBEDDING_TIMEOUT_SECONDS" }}
    {{- else if hasKey $embeddingConfigMap.data "EMBEDDING_TIMEOUT" }}
      {{- /* Fallback to old name for backwards compatibility */ -}}
      {{- $embeddingTimeout = index $embeddingConfigMap.data "EMBEDDING_TIMEOUT" }}
    {{- end }}
    {{- if hasKey $embeddingConfigMap.data "EMBEDDING_MODEL_NAME" }}
      {{- $embeddingModelName = index $embeddingConfigMap.data "EMBEDDING_MODEL_NAME" }}
    {{- end }}
  {{- end }}
  EMBEDDING_TIMEOUT_SECONDS: {{ $embeddingTimeout | quote }}
  EMBEDDING_MODEL_NAME: {{ $embeddingModelName | quote }}
  {{- $embeddingReplicas := int (.Values.embeddingReplicas | default 1) }}
  {{- $maxNewWorkers := 8 }}
  {{- $celeryBatchSize := 128 }}
  {{- /* Calculate MAX_NEW_WORKERS and CELERY_BATCH_SIZE based on balloons state */ -}}
  {{- /* When balloons enabled: MAX_NEW_WORKERS = replicas × 8, CELERY_BATCH_SIZE = replicas × 128 */ -}}
  {{- /* When balloons disabled: MAX_NEW_WORKERS = replicas × 4, CELERY_BATCH_SIZE = replicas × 32 */ -}}
  {{- $balloonsEnabled := .Values.balloonsEnabled | default false }}
  {{- if $balloonsEnabled }}
    {{- $maxNewWorkers = mul $embeddingReplicas 8 }}
    {{- $celeryBatchSize = mul $embeddingReplicas 128 }}
  {{- else }}
    {{- $maxNewWorkers = mul $embeddingReplicas 4 }}
    {{- $celeryBatchSize = mul $embeddingReplicas 32 }}
  {{- end }}
  MAX_NEW_WORKERS: {{ $maxNewWorkers | quote }}
  CELERY_BATCH_SIZE: {{ $celeryBatchSize | quote }}
