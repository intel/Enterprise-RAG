# =============================================================================
# Model Manager — model catalog & runtime configuration
# =============================================================================
#   models:    what to deploy (one entry per model)
#   runtimes:  per-engine deploy config (images, versions, env, categories)
#
#   ./model-manager deploy <name> --wait           # deploy a catalog model
#   ./model-manager deploy --id <hf/repo> --cpu 8  # deploy any HuggingFace model by id (no edit needed)
#   ./model-manager undeploy <name>
# =============================================================================


# =============================================================================
# Defaults — cluster-wide fallbacks applied to every model that omits a value
# =============================================================================
defaults:
  namespace: llm-inference        # target namespace for deployments
  runtime: vllm                   # default engine when a model omits one
  replicas: 1                     # default replica count
  require_amx: true               # only schedule model pods on nodes with Intel AMX (NFD label)

# =============================================================================
# Storage — where downloaded model weights live
# =============================================================================
storage:
  pvc_name: model-store           # PVC that holds downloaded model weights

# =============================================================================
# Network — proxy + connectivity settings for pulling weights from HuggingFace
# =============================================================================
network:
  http_proxy: ""                  # e.g. http://proxy:911 — empty inherits from env
  https_proxy: ""                 # e.g. http://proxy:912
  no_proxy: ""                    # e.g. localhost,127.0.0.1,10.0.0.0/8
  connectivity_check: https://huggingface.co   # reachability probe before download


# =============================================================================
# Models — what to deploy (one entry per model)
# =============================================================================
# Required: name, model_id. Everything else is optional and inherits from the
# runtime/category. CLI flags override any field for a one-off deploy.
#
# Common fields:
#   category:        llm | embed | rerank | vlm   (drives default args + cpu/memory)
#   cpu / memory:    resource requests            (default from category)
#   replicas:        replica count                (default: 1)
#   namespace:       target namespace             (default: llm-inference)
#   accelerator:     cpu | <cluster profile>   where THIS model runs. Omit to
#                    follow the cluster (kubernetes_accelerator); `cpu` pins to
#                    CPU even on a GPU cluster (e.g. keep embed/rerank on CPU
#                    while the LLM uses the GPU). Passed to model-manager as
#                    --accelerator by app_inference_models.
#   chat_template:   file path or inline Jinja → vLLM --chat-template
#   args: [ ... ]    extra engine args   (appended after category/version args)
#   env:  { ... }    extra env vars      (merged over runtime env)

models:

  # LLM — quantized Llama-3 8B, chat/completion
  - name: llama3-8b-awq
    model_id: casperhansen/llama-3-8b-instruct-awq
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 32
    memory: 24Gi
    replicas: 1
    args: [--max-num-seqs, "32", --max-num-batched-tokens, "1024", --enable-chunked-prefill, --max-num-partial-prefills, "1", --long-prefill-token-threshold, "2048", --enable-prefix-caching ]

  # LLM — Meta Llama 3.1 8B Instruct
  - name: llama3-1-8b
    model_id: meta-llama/Llama-3.1-8B-Instruct
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 32
    memory: 32Gi
    args: [--max-num-seqs, "32", --max-num-batched-tokens, "1024", --enable-chunked-prefill, --max-num-partial-prefills, "1", --long-prefill-token-threshold, "2048", --enable-prefix-caching ]

  # LLM — Llama 3 13B Instruct (AWQ, repackaged by solidrust)
  # Named with the solidrust- prefix because the AWQ variant is not Meta's;
  # solidrust is the HF org that publishes the quantized weights.
  - name: solidrust-llama3-13b-awq
    model_id: solidrust/Llama-3-13B-Instruct-v0.1-AWQ
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 32
    memory: 64Gi
    args: [--max-num-seqs, "32", --max-num-batched-tokens, "1024", --enable-chunked-prefill, --max-num-partial-prefills, "1", --long-prefill-token-threshold, "2048", --enable-prefix-caching ]

  # LLM — Mistral 7B Instruct v0.3 (AWQ, repackaged by solidrust)
  # Named with the solidrust- prefix because the AWQ variant is not Mistral's;
  # solidrust is the HF org that publishes the quantized weights.
  - name: solidrust-mistral-7b-v0-3-awq
    model_id: solidrust/Mistral-7B-Instruct-v0.3-AWQ
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 32
    memory: 32Gi
    args: [--max-num-seqs, "32", --max-num-batched-tokens, "1024", --enable-chunked-prefill, --max-num-partial-prefills, "1", --long-prefill-token-threshold, "2048", --enable-prefix-caching ]

  # LLM — Qwen3 14B
  - name: qwen3-14b
    model_id: Qwen/Qwen3-14B
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 32
    memory: 64Gi
    args: [--max-num-seqs, "32", --max-num-batched-tokens, "1024", --enable-chunked-prefill, --max-num-partial-prefills, "1", --long-prefill-token-threshold, "2048", --enable-prefix-caching ]

  # LLM — Qwen3 14B (AWQ)
  - name: qwen3-14b-awq
    model_id: Qwen/Qwen3-14B-AWQ
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 32
    memory: 64Gi
    args: [--max-num-seqs, "32", --max-num-batched-tokens, "1024", --enable-chunked-prefill, --max-num-partial-prefills, "1", --long-prefill-token-threshold, "2048", --enable-prefix-caching ]

  # Embedding — BGE base English (768-dim)
  - name: bge-base-en
    model_id: BAAI/bge-base-en-v1.5
    category: embed
    runtime: vllm
    server_version: "0.19.1"
    cpu: 4
    memory: 3Gi
    env:
      VLLM_CPU_NUM_OF_RESERVED_CPU: 0

  # Embedding — Nomic Embed Text v1 (768-dim)
  # gpu-memory-utilization 0.7: CPU backend clamps to cgroup; 0.92 default OOMs after torch startup.
  - name: nomic-embed
    model_id: nomic-ai/nomic-embed-text-v1
    category: embed
    runtime: vllm
    server_version: "0.24.0"
    cpu: 4
    memory: 8Gi
    args: [ --gpu-memory-utilization, "0.7" ]

  # Reranker — BGE reranker for RAG pipelines
  - name: bge-reranker-v2-m3
    model_id: BAAI/bge-reranker-v2-m3
    category: rerank
    runtime: vllm
    server_version: "0.24.0"
    cpu: 4
    memory: 8Gi
    args: [ --gpu-memory-utilization, "0.7" ]


  # Embedding — multilingual E5 large instruct (1024-dim, 512-token window)
  # 12Gi needed: XLM-RoBERTa-large weights + torch startup exceed 0.7 × 8Gi.
  - name: e5-large-instruct
    model_id: intfloat/multilingual-e5-large-instruct
    category: embed
    runtime: vllm
    server_version: "0.24.0"
    cpu: 4
    memory: 12Gi
    args: [ --gpu-memory-utilization, "0.7" ]

  # Embedding — Stella PL retrieval (Polish, Qwen2-based, 8k window, 1024-dim)
  # Generative arch → --runner pooling required; vLLM applies both pooling + Dense projection.
  - name: stella-pl-retrieval
    model_id: sdadas/stella-pl-retrieval-8k
    category: embed
    runtime: vllm
    server_version: "0.24.0"
    cpu: 8
    memory: 16Gi
    args: [ --runner, pooling, --max-model-len, "8192", --gpu-memory-utilization, "0.7" ]

  # Reranker — BGE base reranker (bilingual: English & Chinese, 512 token window)
  - name: bge-reranker
    model_id: BAAI/bge-reranker-base
    category: rerank
    runtime: vllm
    server_version: "0.19.1"
    cpu: 4
    memory: 6Gi
    env:
      VLLM_CPU_NUM_OF_RESERVED_CPU: 0

  # Reranker — Polish RoBERTa reranker v3 (8k window)
  - name: polish-reranker-v3
    model_id: sdadas/polish-reranker-roberta-v3
    category: rerank
    runtime: vllm
    server_version: "0.24.0"
    cpu: 4
    memory: 16Gi
    args: [ --gpu-memory-utilization, "0.7" ]

  # LLM — ALMA 7B (translation), custom chat template
  - name: alma-7b-r
    model_id: haoranxu/ALMA-7B-R
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 16
    memory: 32Gi
    chat_template: |
      {%- for message in messages if message['role'] != 'system' -%}
      {%- if message['role'] == 'user' -%}
      {{- "<s>[INST] " + message['content'].strip() + " [/INST]" -}}
      {%- elif message['role'] == 'assistant' -%}
      {{- " " + message['content'].strip() + " </s>" -}}
      {%- endif -%}
      {%- endfor -%}

  # LLM — PLLuM 8B (Polish, Llama-derived)
  - name: pllum-8b
    model_id: CYFRAGOVPL/Llama-PLLuM-8B-instruct
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 16
    memory: 32Gi
    env:
      VLLM_CPU_KVCACHE_SPACE: "10"
    args: [ --distributed-executor-backend, mp, --max-model-len, "4096", --max-num-seqs, "256" ]

  # LLM — PLLuM 12B (Polish)
  - name: pllum-12b
    model_id: CYFRAGOVPL/PLLuM-12B-chat
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 16
    memory: 64Gi
    env:
      VLLM_CPU_KVCACHE_SPACE: "10"
    args: [ --distributed-executor-backend, mp, --max-model-len, "4096", --max-num-seqs, "256" ]

  # LLM — PLLuM 12B chat 2512 (Polish, Mistral-derived, no bundled chat_template)
  - name: pllum-12b-2512
    model_id: CYFRAGOVPL/PLLuM-12B-chat-2512
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 16
    memory: 64Gi
    chat_template: |
      {%- if messages[0]['role'] == 'system' %}
          {%- set system_message = messages[0]['content'] %}
          {%- set loop_messages = messages[1:] %}
      {%- else %}
          {%- set loop_messages = messages %}
      {%- endif %}
      {{- bos_token }}
      {%- for message in loop_messages %}
          {%- if message['role'] == 'user' %}
              {%- if loop.first and system_message is defined %}
                  {{- '[INST]' + system_message + '\n\n' + message['content'] + '[/INST]' }}
              {%- else %}
                  {{- '[INST]' + message['content'] + '[/INST]' }}
              {%- endif %}
          {%- elif message['role'] == 'assistant' %}
              {{- message['content'] + eos_token }}
          {%- endif %}
      {%- endfor %}
    env:
      VLLM_CPU_KVCACHE_SPACE: "10"
    args: [ --distributed-executor-backend, mp, --max-model-len, "4096", --max-num-seqs, "256" ]

  # LLM — Bielik 1.5B (Polish)
  - name: bielik-1-5b
    model_id: speakleash/Bielik-1.5B-v3.0-Instruct
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 16
    memory: 32Gi
    env:
      VLLM_CPU_KVCACHE_SPACE: "10"
    args: [ --distributed-executor-backend, mp, --max-model-len, "4096", --max-num-seqs, "256" ]

  # LLM — Bielik 4.5B (Polish, not validated)
  - name: bielik-4-5b
    model_id: speakleash/Bielik-4.5B-v3.0-Instruct
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 16
    memory: 32Gi
    env:
      VLLM_CPU_KVCACHE_SPACE: "10"
    args: [ --distributed-executor-backend, mp, --max-model-len, "4096", --max-num-seqs, "256" ]

  # LLM — Bielik 11B (Polish)
  - name: bielik-11b
    model_id: speakleash/Bielik-11B-v3.0-Instruct
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 16
    memory: 64Gi
    env:
      VLLM_CPU_KVCACHE_SPACE: "10"
    args: [ --distributed-executor-backend, mp, --max-model-len, "4096", --max-num-seqs, "256" ]


# =============================================================================
# Runtimes — per-engine deploy config (images, versions, env, categories)
# =============================================================================
# Per-engine deploy config, so the full picture of what a server runs with is in
# one place. Low-level plumbing (device, kind, routing, CR manifest pointer)
# lives in runtimes/<name>/values.yaml and is merged in at load.
#
# Effective config a pod receives (each layer overrides the one before it):
#   env   = common env   + category env  + version env delta   + per-model env  + --env
#   args  = category args + version args delta  + per-model args  + --arg
#   image = the selected version's image
#
# Version selected by:  --server-version  >  model server_version:  >  default_version

runtimes:

  # ── vLLM (CPU) ──────────────────────────────────────────────────────────────
  vllm:
    default_version: "0.24.0"

    env:
      USER: "vllm"
      VLLM_CPU_NUM_OF_RESERVED_CPU: "1"
      VLLM_CPU_SGL_KERNEL: "1"
      VLLM_NO_USAGE_STATS: "1"
      KMP_BLOCKTIME: "1"

    versions:
      "0.24.0":
        image: "docker.io/vllm/vllm-openai-cpu:v0.24.0"
      "0.21.0":
        image: "docker.io/vllm/vllm-openai-cpu:v0.21.0"
      "0.19.1":
        image: "docker.io/vllm/vllm-openai-cpu:v0.19.1"
        args: [ --max-num-seqs, "256" ]

    categories:
      llm:
        args: [ --dtype, bfloat16, --max-num-seqs, "128", --max-num-batched-tokens, "2048", --enable-prefix-caching, --enable-chunked-prefill ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 8, memory: "16Gi", kv_cache_gb: 8 }
      embed:
        args: [ --dtype, bfloat16 ]
        defaults: { cpu: 4, memory: "8Gi" }
      rerank:
        args: [ --dtype, bfloat16 ]
        defaults: { cpu: 4, memory: "8Gi" }
      vlm:
        args: [ --dtype, bfloat16, --max-num-seqs, "64", --max-num-batched-tokens, "1024" ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 16, memory: "48Gi", kv_cache_gb: 8 }

  # ── vLLM (Intel GPU / XPU) ────────────────────────────────────────────────────
  # Selected when kubernetes_accelerator=intel-gpu: llm_services / app_inference_models
  # export MM_VLLM_RUNTIME=vllm-xpu, so model-manager remaps a model's logical `vllm`
  # runtime to this one. The engine plumbing (device: xpu, kind, routing) is NOT
  # repeated here — it is deep-merged in at load from the inference repo's
  # runtimes/vllm-xpu/values.yaml (models.yaml wins on key clashes); this overlay
  # only carries the image, env and per-category args/resources. device: xpu (!= cpu)
  # is what makes render_manifest request gpu.intel.com/xe per pod. No VLLM_CPU_* env —
  # the XPU backend allocates its KV cache in device memory.
  vllm-xpu:
    default_version: "0.21.0"

    # Common env — applied to every XPU vLLM pod.
    # LD_LIBRARY_PATH: the intel/vllm image ships the oneAPI runtime (oneCCL, MKL,
    # DNNL, SYCL/compiler libs) under /opt/intel/oneapi but bakes NO LD_LIBRARY_PATH
    # — it expects `setvars.sh` to be sourced. KServe launches `vllm serve` via the
    # image ENTRYPOINT without sourcing it, so `import torch` fails with
    # `libccl.so.1: cannot open shared object file`. We point at each component's
    # `latest` symlink (e.g. ccl/latest -> ccl/2021.15) rather than the versioned
    # dirs, so the list is version-agnostic and survives an image bump without edits.
    # These are exactly the lib dirs `setvars.sh` prepends; verified with `import
    # torch` in the 0.21.0-xpu pod. Delivered as a plain container `env:` var — it
    # survives the KServe llmisvc base-template merge and reaches the pod unchanged
    # (confirmed against the deployed LLMInferenceService).
    env:
      USER: "vllm"
      VLLM_NO_USAGE_STATS: "1"
      LD_LIBRARY_PATH: "/opt/intel/oneapi/tcm/latest/lib:/opt/intel/oneapi/umf/latest/lib:/opt/intel/oneapi/tbb/latest/lib/intel64/gcc4.8:/opt/intel/oneapi/pti/latest/lib:/opt/intel/oneapi/mpi/latest/opt/mpi/libfabric/lib:/opt/intel/oneapi/mpi/latest/lib:/opt/intel/oneapi/mkl/latest/lib:/opt/intel/oneapi/dnnl/latest/lib:/opt/intel/oneapi/debugger/latest/opt/debugger/lib:/opt/intel/oneapi/compiler/latest/opt/compiler/lib:/opt/intel/oneapi/compiler/latest/lib:/opt/intel/oneapi/ccl/latest/lib"

    # Intel's XPU build of vLLM (SYCL/oneAPI backend for Intel GPUs).
    versions:
      "0.21.0":
        image: "intel/vllm:0.21.0-xpu"

    # Per-category engine args + resource defaults (a model's own values override).
    # --device xpu is implicit: the intel/vllm image auto-selects the XPU platform.
    categories:
      llm:
        args: [ --dtype, float16, --max-num-seqs, "128", --max-num-batched-tokens, "2048", --enable-prefix-caching, --enable-chunked-prefill ]
        defaults: { cpu: 8, memory: "16Gi" }
      embed:
        args: [ --dtype, float16 ]
        defaults: { cpu: 4, memory: "8Gi" }
      rerank:
        args: [ --dtype, float16 ]
        defaults: { cpu: 4, memory: "8Gi" }
      vlm:
        args: [ --dtype, float16, --max-num-seqs, "64", --max-num-batched-tokens, "1024" ]
        defaults: { cpu: 16, memory: "48Gi" }

  # ── OpenVINO Model Server ─────────────────────────────────────────────────────
  openvino:
    env: {}
    categories:
      llm:
        defaults: { cpu: 8, memory: "16Gi" }
      embed:
        defaults: { cpu: 4, memory: "8Gi" }
      rerank:
        defaults: { cpu: 4, memory: "8Gi" }
