---
name: Ansible Lint

# Actions are pinned to full commit SHAs (the trailing `# vX.Y.Z` is the tag
# that SHA corresponded to) and every tool to an exact version -- no floating
# tags. Version bumps are therefore explicit, reviewable changes to this file.
#
# Only GitHub-hosted runners and public actions are used. This is deliberate
# and is why these workflows live on the public branches only: internal CI runs
# on self-hosted runners that do not exist for this repository on github.com.
#
# Blocking: any finding fails the job. The backlog was cleared, so a new
# finding is a regression -- fix it rather than reintroducing soft-fail.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The interpreter here runs ansible-lint itself and is independent of the
      # `requires-python = ">=3.11,<3.12"` that the microservices under src/
      # declare -- none of their dependencies are installed for a static lint.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install ansible-lint
        run: pip install --disable-pip-version-check "ansible-lint==26.8.0"

      # Style-only rule families are skipped so that what is reported is
      # correctness and command-shell risk.
      #
      # `name` in particular: every task in this tree is named
      # "app_<role> | <Action>" (see deployment/roles/*/tasks/*.yaml), a
      # deliberate convention that name[casing] -- which wants a capitalised
      # sentence -- flags on essentially every task. Left enabled it buries
      # the substantive findings.
      #
      # Only deployment/roles and the backup playbook are ansible content;
      # the playbooks/ and env/ trees referenced by deployment/backup.yaml are
      # supplied per-environment and are not part of this repository.
      - name: Run ansible-lint
        run: >-
          ansible-lint --nocolor
          --skip-list name,var-naming,fqcn,yaml,jinja,key-order
          deployment/roles/ deployment/backup.yaml
