name: "Val :: Unit tests"

on:
  push:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs; every push to main/release keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: "${{ matrix.test-name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    # Runs as root: some tox envs apt-install system packages in commands_pre.
    container: python:3.12-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        test-name:
          - asr_unit_tests
          - chat_history_unit_tests
          - contextual_rag_unit_tests
          - deployment_scripts_unit_tests
          - docsum_unit_tests
          - edp_unit_tests
          - embeddings_unit_tests
          - fingerprint_invariants_unit_tests
          - ingestion_unit_tests
          - language_detection_unit_tests
          - late_chunking_unit_tests
          - llm_guard_dataprep_guardrail_unit_tests
          - llm_guard_input_guardrail_unit_tests
          - llm_guard_output_guardrail_unit_tests
          - llms_unit_tests
          - prompt_template_unit_tests
          - reranks_unit_tests
          - retrievers_unit_tests
          - system_fingerprint_unit_tests
          - text_compression_unit_tests
          - text_extractor_unit_tests
          - text_splitter_unit_tests
          - tts_unit_tests
          - vectorstores_unit_tests
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test prerequisites
        run: |
          apt-get update
          apt-get -y install --no-install-recommends libgl1 build-essential

      # Versions must match [tox] requires in src/tox.ini, otherwise tox
      # provisions a second copy of itself in .tox/.tox on every run.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.17"
          enable-cache: true
          cache-python: true
          cache-suffix: ${{ matrix.test-name }}

      - name: Install tox
        run: |
          uv tool install tox==4.30.2 --with tox-uv==1.28.0 --with uv==0.8.17
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Run unit tests
        working-directory: src
        env:
          TEST_NAME: ${{ matrix.test-name }}
        run: tox run -e "${TEST_NAME}"

  # Single stable check for branch protection, independent of matrix entries.
  unit-tests-result:
    name: "Unit tests result"
    if: always()
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check unit test results
        env:
          RESULT: ${{ needs.unit-tests.result }}
        run: |
          echo "unit-tests: ${RESULT}"
          [[ "${RESULT}" == "success" ]]
