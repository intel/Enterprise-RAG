# -----------------------------------------------------------------------------

[testenv:e2e-ui]
description = Run UI tests with Playwright using E2E credential file approach
deps = {[testenv:test-base]deps}
       -r tests/e2e/ui/requirements.txt
setenv = {[testenv:test-base]setenv}
passenv = {[testenv:test-base]passenv}
          DISPLAY
          HEADLESS
          VIEWPORT
          XAUTHORITY
          ERAG_DOMAIN
          XDG_RUNTIME_DIR
          PULSE_SERVER
allowlist_externals = mkdir
changedir = {[testenv:test-base]changedir}
commands_pre = 
    playwright install firefox
    mkdir -p test-results/screenshots test-results/videos test_logs
commands = pytest -vv -s --capture=tee-sys  --alluredir allure-results --clean-alluredir --log-format="%(asctime)s %(levelname)s [%(module)s] %(message)s" e2e/ui/ {posargs}

# -----------------------------------------------------------------------------

[testenv:e2e-ui-smoke]
description = Run e2e UI smoke tests
deps = {[testenv:e2e-ui]deps}
setenv = {[testenv:e2e-ui]setenv}
passenv = {[testenv:e2e-ui]passenv}
allowlist_externals = {[testenv:e2e-ui]allowlist_externals}
changedir = {[testenv:e2e-ui]changedir}
commands_pre = {[testenv:e2e-ui]commands_pre}
commands = pytest -vv -s --capture=tee-sys --alluredir allure-results --clean-alluredir --log-format="%(asctime)s %(levelname)s [%(module)s] %(message)s" e2e/ui/ -m ui_smoke {posargs}

# -----------------------------------------------------------------------------

[testenv:e2e-evals-multihop-tool]
description = Run eval_multihop tool tests with isolated dependencies
basepython = python3.12
setenv = {[testenv:test-base]setenv}
         PYTHONPATH={toxinidir}/src
passenv = {[testenv:test-base]passenv}
deps =
    pytest
    allure-pytest
    -r tests/e2e/evals/evaluation/rag_eval/requirements.txt
changedir = tests/e2e/evals/evaluation/rag_eval/examples
commands =
    pytest -vv -s --capture=tee-sys --alluredir {toxinidir}/tests/allure-results \
    --confcutdir={toxinidir}/tests/e2e/evals/evaluation/rag_eval/examples \
    --clean-alluredir --log-format="%(asctime)s %(levelname)s [%(module)s] %(message)s" \
    test_multihop_tool.py {posargs}
