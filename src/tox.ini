[testenv:text_extractor_unit_tests]
description = Run Text Extractor microservice unit tests
runner = uv-venv-lock-runner
allowlist_externals =
    apt
    env
commands_pre =
    apt install -y libgl1 asciidoctor libcairo2 libreoffice-nogui libmagic1
    # unstructured downloads these on import; nltk >= 3.10.3 refuses proxied
    # downloads (SSRF hardening), so fetch them up front with the opt-in set.
    env NLTK_ALLOW_PROXIED_URLOPEN=1 python -m nltk.downloader -d {envdir}/nltk_data punkt_tab averaged_perceptron_tagger averaged_perceptron_tagger_eng
setenv =
    PYTHONPATH = .
uv_sync_flags = --project, comps/text_extractor/impl/microservice/pyproject.toml
uv_python_preference = only-managed
basepython = python3.11
extras =
    test
commands =
    pytest -s --disable-warnings --cov=comps/text_extractor --cov-report=term-missing tests/unit/text_extractor {posargs}

