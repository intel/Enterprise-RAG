[testenv:microservices]
description = Run microservices tests
changedir = tests/microservices
setenv =
    PYTHONPATH={toxinidir}
passenv =
    HF_TOKEN
deps =
    -r tests/microservices/requirements.txt
commands =
    pytest -s --capture=tee-sys --alluredir allure-results --clean-alluredir {posargs}

# -----------------------------------------------------------------------------

[testenv:test-base]
description = Base configuration for tests
changedir = tests
setenv =
    PYTHONPATH={toxinidir}
    # Consider all indexes (PyPI + pytorch cpu) when resolving; both are trusted.
    # Required so requests/etc. still resolve from PyPI alongside torch's +cpu wheels.
    UV_INDEX_STRATEGY=unsafe-best-match
passenv =
    ERAG_LOG_DIR
    KUBECONFIG
    SCENARIO
    CLUSTER_STATE
    EXPECTED_MODEL_NAME
    NO_PROXY
    no_proxy
    TEST_LANG
    KEYCLOAK_ERAG_SSO_ADMIN_USERNAME
    KEYCLOAK_ERAG_SSO_ADMIN_PASSWORD
    KEYCLOAK_ERAG_SSO_USER_USERNAME
    KEYCLOAK_ERAG_SSO_USER_PASSWORD
    KEYCLOAK_ERAG_SSO_MAINTAINER_USERNAME
    KEYCLOAK_ERAG_SSO_MAINTAINER_PASSWORD
    SP_SITE_URL_ALL
    SP_SITE_URL_ADMIN
    SP_SITE_URL_USER
deps =
    -r tests/e2e/validation/requirements.txt

# -----------------------------------------------------------------------------

[testenv:e2e]
description = Run end-to-end tests on a running cluster
deps = {[testenv:test-base]deps}
setenv =
    {[testenv:test-base]setenv}
    TEST_LANG = en
passenv = {[testenv:test-base]passenv}
changedir = {[testenv:test-base]changedir}
commands =
    pytest -vv -s --capture=tee-sys --alluredir allure-results --clean-alluredir --log-format="%(asctime)s %(levelname)s [%(module)s] %(message)s" e2e/validation {posargs}

# -----------------------------------------------------------------------------

