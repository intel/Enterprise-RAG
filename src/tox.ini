[tox]
requires =
    tox==4.30.2
    tox-uv==1.28.0
    uv==0.8.17

env_list =
    py312

[testenv]
basepython = python3.12

# -----------------------------------------------------------------------------

[testenv:asr_unit_tests]
description = Run asr microservice unit tests
runner = uv-venv-lock-runner
set_env =
    PYTHONPATH = .
uv_sync_flags = --project, comps/asr/impl/microservice/pyproject.toml
uv_python_preference = only-managed
basepython = python3.11
extras =
    test
commands =
    pytest -s --disable-warnings --cov=comps/asr --cov-report=term-missing tests/unit/asr {posargs}

# -----------------------------------------------------------------------------

