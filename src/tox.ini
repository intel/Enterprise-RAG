[testenv:deployment_scripts_unit_tests]
description = Run deployment helper script unit tests (pipeline composer)
setenv =
    PYTHONPATH = .
deps =
    pytest==9.0.3
    pytest-cov==5.0.0
    PyYAML==6.0.2
    Jinja2==3.1.6
commands =
    # --cov names the module, not the path: the composer is loaded by importlib from
    # ../deployment/scripts (not an importable package), so coverage must match on the
    # module name it is registered under.
    pytest -s --disable-warnings --cov=compose_pipeline --cov-report=term-missing tests/unit/scripts {posargs}

