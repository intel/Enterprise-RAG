deps =
    pytest==9.0.3
    requests==2.33.1
    kr8s==0.20.15
    # The guard helper reads each scanner's defaults from the fingerprint value
    # models, so those models must be importable here.
    pydantic==2.13.4
commands =
    pytest -s --disable-warnings tests/unit/fingerprint_invariants {posargs}

