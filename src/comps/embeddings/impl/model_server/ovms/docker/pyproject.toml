[project]
name = "Intel-Enterprise-RAG-Embedding-OpenVINO"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "openvino_tokenizers>=2026.0.0.0,<2027.0.0",
    "openvino>=2026.0.0,<2027.0.0",
    "optimum-intel>=2.1.0,<3.0.0",
    "torch>=2.13.0,<3.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "MarkupSafe>=3.0.2,<4.0.0",
    "setuptools>=80.10.2,<81.0.0",     # security update
    "requests>=2.33.1,<3.0.0",
    "urllib3>=2.8.0,<3.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "transformers>=5.5.0,<5.6",
    "anyio>=4.14.2,<5.0.0",
]

[dependency-groups]
security-overrides = [
  "protobuf>=7.35.0,<8.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
