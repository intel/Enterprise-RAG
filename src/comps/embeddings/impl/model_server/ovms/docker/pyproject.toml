[project]
name = "Intel-Enterprise-RAG-Embedding-OpenVINO"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "openvino_tokenizers==2026.0.0.0",
    "openvino==2026.0.0",
    "optimum-intel==2.1.0",
    "torch>=2.13.0,<3.0.0",
    "jinja2 == 3.1.6",
    "MarkupSafe==3.0.2",
    "setuptools == 80.10.2",     # security update
    "requests == 2.33.1",
    "urllib3>=2.8.0,<3.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "transformers>=5.5.0,<5.6",
    "anyio>=4.14.2",
]

[dependency-groups]
security-overrides = [
  "protobuf>=6.33.5",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
