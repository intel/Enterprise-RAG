[project]
name = "Intel-Enterprise-RAG-VectorStores"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "shortuuid>=1.0.13,<2.0.0",
    "redis>=7.3.0,<8.0.0",
    "redisvl>=0.16.0,<0.28",
    "pyodbc>=5.3.0,<6.0.0",
    "urllib3>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "fastapi>=0.136.3,<1.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "docarray[full]>=0.40.0,<1.0.0",
    "opentelemetry-api>=1.40.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.40.0,<2.0.0",
    "opentelemetry-sdk>=1.40.0,<2.0.0",
    "h11>=0.16.0,<1.0.0",
    "anyio>=4.14.2,<5.0.0",
    "pillow>=12.3.0,<13.0.0",
]
