[project]
name = "Intel-Enterprise-RAG-LLM_Guard_Dataprep_Guardrail_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pip>=26.2,<27.0.0",
    "docarray[proto,image]>=0.40.0,<1.0.0",
    "fastapi>=0.136.3,<1.0.0",
    "opentelemetry-api>=1.39.1,<2.0.0",
    "opentelemetry-exporter-otlp>=1.39.1,<2.0.0",
    "opentelemetry-sdk>=1.39.1,<2.0.0",
    "prometheus-fastapi-instrumentator>=8.0.0,<9.0.0",
    "shortuuid>=1.0.13,<2.0.0",
    "uvicorn>=0.30.1,<1.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "h11>=0.16.0,<1.0.0",
    "requests>=2.33.1,<3.0.0",
    "urllib3>=2.8.0,<3.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "aiohttp>=3.14.3,<4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "fastapi>=0.136.3,<1.0.0",
    "docarray[proto,image]>=0.40.0,<1.0.0",
    "opentelemetry-api>=1.39.1,<2.0.0",
    "opentelemetry-exporter-otlp>=1.39.1,<2.0.0",
    "opentelemetry-sdk>=1.39.1,<2.0.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0,<13.0.0",
  "protobuf>=6.33.5,<7.0.0",
  "setuptools>=84.0.0,<85.0.0",
]

llm-guard = [
  "bc-detect-secrets>=1.5.47,<2.0.0",
  "nltk>=3.9.4,<4.0.0",
  "presidio-anonymizer>=2.2.364,<3.0.0",
  "structlog>=26.1.0,<27.0.0",
  "tiktoken>=0.13.0,<1.0.0",
  # Pinned rather than floored: optimum and transformers have to stay mutually
  # compatible and the transformers/torch versions affect scanner inference results.
  "optimum[onnxruntime]==2.1.0",
  "torch>=2.13.0,<3.0.0",
  "transformers==4.57.3",
]

[tool.uv]
# presidio-anonymizer 2.2.364 (latest) caps cryptography <49, which leaves
# CVE-2026-69249 and CVE-2026-69247 unfixed. Only TextReplaceBuilder is used from
# presidio-anonymizer, not its cryptography-based operators. Drop this override
# once presidio-anonymizer allows cryptography>=50.
override-dependencies = [
  "cryptography>=50.0.0,<51.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
