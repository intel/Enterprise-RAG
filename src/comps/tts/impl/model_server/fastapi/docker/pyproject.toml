[project]
name = "Intel-Enterprise-RAG-TTS_FastAPI_Modelserver"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "fastapi>=0.136.3,<1.0.0",
    "uvicorn>=0.30.1,<1.0.0",
    "shortuuid>=1.0.13,<2.0.0",
    "starlette>=1.0.1,<2.0.0",
    "transformers>=5.19.0,<6.0.0",
    "torch>=2.10.0,<3.0.0",
    "torchaudio>=2.10.0,<3.0.0",
    "soundfile>=0.13.1,<1.0.0",
    "pydub>=0.25.1,<1.0.0",
    "datasets>=5.0.1,<6.0.0",
    "sentencepiece>=0.2.1,<1.0.0", # dependency of SpeechT5
    "urllib3>=2.8.0,<3.0.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0,<13.0.0",
  "protobuf>=7.36.2,<8.0.0",
  "fsspec>=2026.6.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchaudio = [
    { index = "torchaudio-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torchaudio-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
