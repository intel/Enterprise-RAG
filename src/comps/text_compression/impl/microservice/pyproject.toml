[project]
name = "Intel-Enterprise-RAG-Text_Compression_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "docarray[proto,image]>=0.40.0,<1.0.0",
    "fastapi>=0.136.3,<1.0.0",
    "opentelemetry-api>=1.39.1,<2.0.0",
    "opentelemetry-exporter-otlp>=1.39.1,<2.0.0",
    "opentelemetry-sdk>=1.39.1,<2.0.0",
    "prometheus-fastapi-instrumentator>=8.0.0,<9.0.0",
    "shortuuid>=1.0.13,<2.0.0",
    "uvicorn>=0.30.1,<1.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "nltk>=3.10.3,<4.0.0",
    "requests>=2.33.1,<3.0.0",
    "urllib3>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "fastapi>=0.136.3,<1.0.0",
    "docarray[proto,image]>=0.40.0,<1.0.0",
    "opentelemetry-api>=1.39.1,<2.0.0",
    "opentelemetry-exporter-otlp>=1.39.1,<2.0.0",
    "opentelemetry-sdk>=1.39.1,<2.0.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0,<13.0.0",
  "protobuf>=6.33.5,<7.0.0",
]
