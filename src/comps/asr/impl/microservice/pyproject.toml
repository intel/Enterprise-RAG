[project]
name = "Intel-Enterprise-RAG-ASR_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4.0.0",
    "docarray[proto,image]==0.40.0",
    "fastapi==0.136.3",
    "langchain>=1.3.9,<2.0.0",
    "langchain-openai>=1.1.14,<2.0.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "prometheus-fastapi-instrumentator==8.0.0",
    "uvicorn==0.30.1",
    "shortuuid==1.0.13",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.136.3",
    "docarray[proto,image]==0.40.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-sdk==1.39.1",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=6.33.5",
  "urllib3>=2.8.0,<3.0.0",
]
