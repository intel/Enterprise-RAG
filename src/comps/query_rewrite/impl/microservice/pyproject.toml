[project]
name = "Intel_Enterprise_RAG-QueryRewrite_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4.0.0",
    "docarray[proto,image]==0.40.0",
    "fastapi==0.136.3",
    "h11==0.16.0",
    "httpx==0.27.0",
    "jinja2==3.1.6",
    "openai>=1.12.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-exporter-otlp==1.40.0",
    "prometheus-fastapi-instrumentator==8.0.0",
    "python-dotenv==1.2.2",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "setuptools==80.10.2",
    "shortuuid==1.0.13",
    "urllib3>=2.8.0,<3.0.0",
    "uvicorn==0.30.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==5.0.0",
]
