[project]
name = "Intel-Enterprise-RAG-Retriever-NER-OVMS"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "optimum-intel==2.1.0",
    "transformers==5.10.4",
    "torch>=2.13.0,<3.0.0",
    "nncf==2.19.0",
    "flask==3.1.3",
    "gunicorn==23.0.0",  
    "numpy==1.26.4",
    "scipy==1.15.3",
    "requests==2.33.1",
    "huggingface-hub>=1.3.0,<2.0.0",
    "urllib3>=2.8.0,<3.0.0",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=6.33.5",
]

[tool.uv]
# optimum-intel 2.1.0 (latest 2.2.0 too) caps transformers <5.6, which leaves
# GHSA-xrqw-3rrv-vx5w unfixed. Drop this override once optimum-intel allows
# transformers>=5.10.4.
override-dependencies = [
  "transformers==5.10.4",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
