[project]
name = "Intel-Enterprise-RAG-Text_Extractor_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi==0.136.3",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "prometheus-fastapi-instrumentator==8.0.0",
    "numpy==2.1.0",
    "docarray[proto,image]==0.40.0",
    "uvicorn==0.30.1",
    "beautifulsoup4==4.14.3",
    "huggingface_hub>=1.5.0,<2.0.0",
    "filelock == 3.20.3", # dependency of huggingface_hub
    "langchain>=1.3.9,<2.0.0",
    "langchain-community==0.4.1",
    "marshmallow==3.26.2", # dependency of langchain_community
    "langchain-text-splitters==1.1.2",
    "langsmith==0.8.18",
    "markdown==3.10.2",
    "nltk==3.10.3",
    "olefile==0.47",
    "pandas==2.2.2",
    "pymupdf==1.27.2.2",
    "pymupdf4llm==1.27.2.2",
    "pymupdf-layout==1.27.2.2",
    "python-bidi==0.4.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pytesseract==0.3.13",
    "regex==2025.11.3",
    "sentence_transformers>=5.6.1,<6.0.0",
    "shortuuid==1.0.13",
    "unstructured[all-docs]==0.24.0",
    "pdfminer-six==20260107", # dependency of all-docs
    "pypdf>=6.19.0", # dependency of unstructured/all-docs; security update
    "pyasn1==0.6.4", # dependency of unstructured
    "cairosvg==2.9.0",
    "python-magic==0.4.27",
    "python-multipart==0.0.32", # required by FastAPI Form/UploadFile; no longer pulled in by unstructured
    "pathvalidate==3.2.2",
    "langchain-experimental==0.4.1",
    "langchain-huggingface==1.2.2",
    "jinja2==3.1.6",
    "python-dotenv==1.2.2",
    "torch>=2.13.0,<3.0.0",
    "torchvision>=0.28.0,<0.29.0",
    "h11==0.16.0",
    "transformers>=5.10.0,<6.0.0",
    "markitdown==0.1.6",
    "setuptools == 80.10.2",     # security update
    "requests == 2.33.1",
    "urllib3>=2.8.0,<3.0.0",
    "opencv-python==4.13.0.90",
    "aiohttp>=3.14.3,<4.0.0",
    "docling>=2.118.1,<3.0.0",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "fastapi==0.136.3",
    "docarray[proto,image]==0.40.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "setuptools==80.10.2",
]

[dependency-groups]
security-overrides = [
  "pillow>=12.3.0",
  "protobuf>=6.33.5",
  "cryptography==50.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "torchvision-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torchvision-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
