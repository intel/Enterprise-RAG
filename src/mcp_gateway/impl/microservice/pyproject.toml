[project]
name = "Intel-Enterprise-RAG-MCP_Gateway"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "uvicorn==0.31.1",
    "starlette>=1.0.1,<2.0.0",
    "httpx==0.28.1",
    "certifi>=2024.8.30",
    "mcp==1.28.1",
    "python-dotenv==1.2.2",
    "h11==0.16.0",
    "anyio>=4.14.2,<5.0.0",
    "validators==0.34.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==5.0.0",
    "respx==0.22.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
security-overrides = [
    "urllib3>=2.8.0",
    "pyjwt>=2.14.0",
]
